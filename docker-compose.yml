services:
  db:
    image: mysql:8.0
    container_name: erles_db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+07:00
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: erles_bakery
      MYSQL_USER: erles
      MYSQL_PASSWORD: erles123
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: erles_pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erles_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
#    volumes:
#      - ./backend:/var/www/html
#      - backend_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: erles_bakery
      DB_USERNAME: erles
      DB_PASSWORD: erles123
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: sh -c "sleep 2 && php artisan migrate --force; exec php artisan serve --host=0.0.0.0 --port=8000"

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: erles_admin
    restart: unless-stopped
    ports:
      - "5174:5174"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5174

  public:
    build:
      context: ./public
      dockerfile: Dockerfile
    container_name: erles_public
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./public:/app
      - public_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  mysqldata:
  backend_vendor:
  admin_node_modules:
  public_node_modules:
